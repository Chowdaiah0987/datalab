  <g fill="#9ec3f4"><circle cx="370" cy="330" r="2.6"/><circle cx="384" cy="322" r="2.6"/><circle cx="396" cy="326" r="2.6"/><circle cx="410" cy="312" r="2.6"/><circle cx="424" cy="316" r="2.6"/><circle cx="438" cy="304" r="2.6"/><circle cx="452" cy="308" r="2.6"/><circle cx="468" cy="296" r="2.6"/></g>
