  <path d="M-10 6L-3 -3L4 2L11 -8" stroke="#2f65a5" stroke-width="2"/>
</g>

<!-- sparkles -->
<g stroke="#d6a43b" stroke-width="1.6">
  <path d="M26 60V76M18 68H34"/><path d="M712 232V246M705 239H719"/><path d="M262 40V50M257 45H267"/>
</g>
