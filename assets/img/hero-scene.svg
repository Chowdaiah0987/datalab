</g>

<!-- ===== human (left of laptop) ===== -->
<g>
  <!-- torso -->
  <path d="M96 372C96 322 128 300 172 300C216 300 248 322 248 372Z" fill="#2f65a5"/>
  <path d="M96 372C96 322 128 300 172 300C216 300 248 322 248 372Z" stroke="#10264b" stroke-width="1.8"/>
