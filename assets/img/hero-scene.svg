  <path d="M136 240C130 200 160 194 178 197C202 199 214 214 208 240C204 224 196 216 178 216C160 216 146 224 136 240Z" fill="#10264b"/>
  <!-- glasses -->
  <rect x="148" y="241" width="22" height="16" rx="6" stroke="#10264b" stroke-width="2"/>
  <rect x="176" y="241" width="22" height="16" rx="6" stroke="#10264b" stroke-width="2"/>
  <path d="M170 249H176" stroke="#10264b" stroke-width="2"/>
  <path d="M160 272Q172 279 186 272" stroke="#10264b" stroke-width="1.6"/>
</g>
<!-- AI thought network above head -->
<g stroke="#2f65a5" stroke-width="1.3" stroke-opacity=".8">
  <path d="M118 140L156 112M118 140L150 160M156 112L200 128M150 160L200 128M156 112L150 160M200 128L246 104M200 128L238 156M246 104L238 156M118 140L96 182"/>
</g>
<g fill="#ffffff" stroke="#2f65a5" stroke-width="1.6">
  <circle cx="118" cy="140" r="7"/><circle cx="156" cy="112" r="8"/><circle cx="150" cy="160" r="7"/>
  <circle cx="200" cy="128" r="9" fill="url(#gold)" stroke="#b8861f"/><circle cx="246" cy="104" r="7"/><circle cx="238" cy="156" r="7"/><circle cx="96" cy="182" r="5"/>
</g>
<path d="M172 200L170 168" stroke="#d6a43b" stroke-width="1.4" stroke-dasharray="2 5"/>

<!-- ===== floating cards ===== -->
<!-- line-graph card (top centre) -->
<g filter="url(#sh)">
  <rect x="300" y="66" width="150" height="96" rx="12" fill="url(#card)" stroke="#c9d8ee"/>
</g>
<path d="M314 84H372" stroke="#10264b" stroke-width="3"/>
<path d="M314 94H350" stroke="#b4c5de" stroke-width="2.4"/>
<path d="M316 148L338 124L356 134L382 110L404 118L434 92" stroke="#2f65a5" stroke-width="2.6"/>
<path d="M316 148L338 124L356 134L382 110L404 118L434 92V152H316Z" fill="#2f65a5" fill-opacity=".1" stroke="none"/>
<circle cx="434" cy="92" r="4.5" fill="url(#gold)" stroke="#fff" stroke-width="1.4"/>

<!-- pie card (top right) -->
<g filter="url(#sh)">
