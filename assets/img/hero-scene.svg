</g>
<circle cx="534" cy="92" r="26" stroke="#2f65a5" stroke-width="16" stroke-dasharray="100 200" transform="rotate(-90 534 92)"/>
<circle cx="534" cy="92" r="26" stroke="#d6a43b" stroke-width="16" stroke-dasharray="40 200" stroke-dashoffset="-100" transform="rotate(-90 534 92)"/>
<circle cx="534" cy="92" r="26" stroke="#9ec3f4" stroke-width="16" stroke-dasharray="23 200" stroke-dashoffset="-140" transform="rotate(-90 534 92)"/>

<!-- scatter card (right) -->
