  <rect x="380" y="233" width="108" height="48" rx="4" fill="#ffffff" fill-opacity=".08"/>
  <rect x="390" y="258" width="10" height="16" fill="#6fa6ea"/><rect x="406" y="248" width="10" height="26" fill="#8fbcf2"/>
  <rect x="422" y="254" width="10" height="20" fill="#6fa6ea"/><rect x="438" y="240" width="10" height="34" fill="#e8c06a"/>
  <rect x="454" y="250" width="10" height="24" fill="#8fbcf2"/><rect x="470" y="244" width="10" height="30" fill="#6fa6ea"/>
  <rect x="282" y="288" width="64" height="58" rx="4" fill="#ffffff" fill-opacity=".08"/>
  <circle cx="314" cy="317" r="19" stroke="#6fa6ea" stroke-width="9" stroke-dasharray="70 120"/>
  <circle cx="314" cy="317" r="19" stroke="#e8c06a" stroke-width="9" stroke-dasharray="26 120" stroke-dashoffset="-70"/>
