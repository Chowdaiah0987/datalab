</g>
<path d="M580 256H676M580 256V188" stroke="#10264b" stroke-width="1.4"/>
<g fill="#2f65a5"><circle cx="594" cy="244" r="3"/><circle cx="608" cy="236" r="3"/><circle cx="618" cy="240" r="3"/><circle cx="632" cy="222" r="3"/><circle cx="644" cy="226" r="3"/><circle cx="656" cy="208" r="3"/><circle cx="668" cy="202" r="3"/></g>
<path d="M588 248L672 198" stroke="#d6a43b" stroke-width="2"/>

<!-- ===== books + graduation cap (right) ===== -->
<g filter="url(#sh)">
  <rect x="584" y="338" width="108" height="34" rx="4" fill="#10264b"/>
  <rect x="598" y="306" width="92" height="32" rx="4" fill="#2f65a5"/>
  <rect x="580" y="276" width="96" height="30" rx="4" fill="#f6eacb" stroke="#c8932a" stroke-width="1.4"/>
</g>
<path d="M598 355H648M612 322H654M596 291H640" stroke="#e8c06a" stroke-width="2.2"/>
<g transform="translate(628 262)">
  <path d="M-40 0L0 -18L40 0L0 18Z" fill="#10264b"/>
  <path d="M-22 10V26C-10 36 10 36 22 26V10L0 20Z" fill="#1b3a70"/>
  <path d="M34 4V28" stroke="#d6a43b" stroke-width="2"/><circle cx="34" cy="31" r="3.4" fill="#d6a43b"/>
</g>

<!-- ===== magnifier on data (left, in front of desk) ===== -->
<g transform="translate(300 380)">
  <rect x="-74" y="-6" width="64" height="18" rx="3" fill="#fff" stroke="#9ab4d8" stroke-width="1.2"/>
  <path d="M-74 3H-10M-52 -6V12M-30 -6V12" stroke="#c9d8ee" stroke-width="1"/>
</g>
<g transform="translate(116 340)">
