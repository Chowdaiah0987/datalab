<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" fill="none" stroke-linecap="round" stroke-linejoin="round">
<defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#cfe2fb" stop-opacity=".95"/>
    <stop offset="1" stop-color="#eaf3ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#14305e"/><stop offset="1" stop-color="#0a1d40"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e8c06a"/><stop offset="1" stop-color="#c8932a"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f6fd"/>
  </linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#10264b" flood-opacity=".16"/>
  </filter>
</defs>

<!-- soft glow + orbit rings -->
<ellipse cx="390" cy="215" rx="330" ry="190" fill="url(#glow)"/>
<ellipse cx="390" cy="225" rx="300" ry="150" stroke="#b7cdeb" stroke-width="1" stroke-dasharray="3 7"/>
<ellipse cx="390" cy="225" rx="230" ry="108" stroke="#d6a43b" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 8"/>

<!-- desk -->
<path d="M70 372H700" stroke="#10264b" stroke-width="2.4"/>
<path d="M110 372V404M660 372V404" stroke="#10264b" stroke-width="2.4"/>
<rect x="70" y="372" width="630" height="9" rx="3" fill="#e9eef7" stroke="#10264b" stroke-width="1.6"/>

